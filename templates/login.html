{% extends 'auth-template.html' %}
<!-- Meta Data -->
{% block metadata %}
<meta name="description" content="" />
<meta name="keywords" content="" />
<title>User Login | JustDial Data Scraping</title>
{% endblock %}
<!-- Main Form -->
{% block main_form %}
<div class="content">
    <h2>
        <span class="account">Log</span>in
    </h2>
    <div class="d-flex justify-content-center">
        <form action="{{ url_for('login') }}" method="POST" id="loginForm">
            <div class="input-div">
                <div class="i">
                    <i class="bi bi-person-fill"></i>
                </div>
                <div>
                    <label for="username">Username or Email</label>
                    <input class="input" type="text" name="username" id="username"
                        value="{{ result.username if result.username else '' }}" required autocomplete="username" />
                </div>
            </div>
            <div class="input-div mb-3">
                <div class="i">
                    <i class="bi bi-lock-fill"></i>
                </div>
                <div>
                    <label for="password">Password</label>
                    <input class="input" type="password" name="password" id="password" required
                        autocomplete="current-password" />
                    <i class="bi bi-eye-fill pw-show-icon" onclick="handleShowPassword(event)"></i>
                </div>
            </div>
            {% if result %}{{ result.error }}{% endif %}
            <div class="d-flex align-items-center justify-content-center mb-3">
                <div class="submit-container">
                    <button onclick="processAndSubmitForm(event, this)" class="btn btn-new shadow-none">Login</button>
                    <div class="loader"></div>
                </div>
            </div>
            <div class="d-flex justify-content-center">
                <p class="account">
                    <a href="/forgot-password">Forgot Password?</a>
                </p>
            </div>
            <p class="account">
                Don't Have An Account? <a href="#">Register</a>
                <br />
            </p>
        </form>
    </div>
</div>
<div class="form-img">
    <img src="/static/img/authentication-image.webp" alt="DNSLoader Authentication" />
</div>
{% endblock %}
